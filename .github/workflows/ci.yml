name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      # No GCP credentials here: tests run against the in-memory store with offline fallbacks.
      - run: python -m pytest tests -q
      # Reviewer benchmark in offline-heuristic mode (guards the detection logic, not the LLM itself).
      - run: python scripts/eval_reviewer.py --allow-offline

  frontend:
    name: Frontend (types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
      # The existing codebase has lint errors (mostly no-explicit-any). Reported, not yet blocking:
      # remove continue-on-error once they are fixed.
      - run: npm run lint
        continue-on-error: true

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
            NEXT_PUBLIC_FIREBASE_API_KEY=ci-placeholder
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-placeholder
            NEXT_PUBLIC_FIREBASE_APP_ID=ci-placeholder
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in infra/*.sh start_local.sh stop_local.sh; do bash -n "$f"; done
      - run: shellcheck --severity=error infra/*.sh

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (advisory)
        run: pip install pip-audit && pip-audit -r backend/requirements.txt || true
      - name: npm audit (advisory)
        working-directory: frontend
        run: npm audit --audit-level=high || true
