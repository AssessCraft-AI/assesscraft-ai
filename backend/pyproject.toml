[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assesscraft-backend"
version = "0.1.0"
description = "AssessCraft AI: Agentic Academic Assessment Copilot on Google Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "google-adk>=2.11.0",
    "google-genai>=2.20.0",
    "google-cloud-firestore>=2.18.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-discoveryengine>=0.13.0",
    "google-cloud-documentai>=3.0.0",
    "google-cloud-bigquery>=3.25.0",
    "ortools>=9.10.0",
    "firebase-admin>=6.5.0",
    "numpy>=1.26.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
